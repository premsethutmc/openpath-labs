<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Machine design bench · OpenPath Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../core/workbench.css">
  <link rel="stylesheet" href="./machine.css">
</head>
<body>
<header class="bar">
  <a class="back" href="../index.html">‹ Labs</a>
  <span class="crumb">Workshop · machine design: shafts</span>
</header>

<nav class="objects scroll" aria-label="Start from" id="starts"></nav>

<main class="wb">
  <section class="wb-main">
    <div class="wb-title"><h1 id="title">Machine design bench</h1><p id="subtitle"></p></div>
    <div class="instrument"><svg id="shaft" viewBox="0 0 600 210" role="img" aria-labelledby="shaft-title"><title id="shaft-title">The shaft, its bearings and loads</title></svg></div>
    <div class="instrument plots"><svg id="plots" viewBox="0 0 600 170" role="img" aria-labelledby="plots-title"><title id="plots-title">Bending moment and deflection along the shaft</title></svg></div>
    <div class="instrument plots" id="speedbox" hidden><svg id="speedplot" viewBox="0 0 600 128" role="img" aria-labelledby="speed-title"><title id="speed-title">Unbalance response against operating speed</title></svg></div>
    <div class="solve" id="status" role="status" aria-live="polite"></div>
    <ul class="checks" id="checks"></ul>
    <dl class="readings" id="readings"></dl>
  </section>

  <section class="side">
    <nav class="dock" aria-label="Modules"></nav>
    <section class="module" data-module="shaft" data-title="Shaft" id="m-shaft"></section>
    <section class="module" data-module="bearings" data-title="Bearings" id="m-bearings"></section>
    <section class="module" data-module="loads" data-title="Loads" id="m-loads"></section>
    <section class="module" data-module="speed" data-title="Speed" id="m-speed"></section>
    <section class="module" data-module="limits" data-title="Limits" id="m-limits"></section>
    <section class="module" data-module="explain" data-title="Explain" id="m-explain"></section>
    <section class="module" data-module="sweep" data-title="Sweep" id="m-sweep"></section>
    <section class="module" data-module="learn" data-title="Learn" id="m-learn"></section>
    <section class="module" data-module="experiments" data-title="Experiments" id="m-experiments"></section>
  </section>
</main>
<script type="module" src="./machine.mjs"></script>
</body>
</html>
